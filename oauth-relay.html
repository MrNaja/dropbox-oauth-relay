<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Tab - OAuth Redirect</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f5f5;
      color: #333;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e0e0e0;
      border-top-color: #4285f4;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .error { color: #d32f2f; }
    .success { color: #388e3c; }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner" id="spinner"></div>
    <p id="status">Processing authorization...</p>
  </div>
  <script>
    // 中转页逻辑：从 URL 中提取授权码，通过 postMessage 传递给扩展的 content script
    (function () {
      var params = new URLSearchParams(window.location.search);
      var hashParams = new URLSearchParams(window.location.hash.replace('#', ''));
      var code = params.get('code') || hashParams.get('code');
      var error = params.get('error') || hashParams.get('error');
      var errorDescription = params.get('error_description') || hashParams.get('error_description');
      var state = params.get('state') || hashParams.get('state');
      var statusEl = document.getElementById('status');
      var spinnerEl = document.getElementById('spinner');

      if (error) {
        spinnerEl.style.display = 'none';
        statusEl.className = 'error';
        statusEl.textContent = 'Authorization failed: ' + (errorDescription || error);
        return;
      }

      if (!code) {
        spinnerEl.style.display = 'none';
        statusEl.className = 'error';
        statusEl.textContent = 'No authorization code found in the URL.';
        return;
      }

      // 通过 postMessage 将授权码传递给 content script
      // content script 会监听此消息并通过 chrome.runtime.sendMessage 转发给 background
      window.postMessage({
        type: 'A_TAB_OAUTH_CODE',
        code: code,
        state: state
      }, '*');

      statusEl.className = 'success';
      statusEl.textContent = 'Authorization successful! You can close this tab.';
      spinnerEl.style.display = 'none';
    })();
  </script>
</body>
</html>
