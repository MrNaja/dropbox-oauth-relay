<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Tab - OAuth Redirect</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f5f5;
      color: #333;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    .success { color: #388e3c; font-size: 1.2rem; }
    .hint { color: #999; margin-top: 0.5rem; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="container">
    <p class="success">Authorization successful!</p>
    <p class="hint">This tab will close automatically.</p>
  </div>
</body>
</html>
